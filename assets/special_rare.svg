<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 192" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe259" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#ffa751" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9d2"/>
      <stop offset="35%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#e6ac00"/>
      <stop offset="100%" stop-color="#b37d00"/>
    </linearGradient>
    <linearGradient id="goldHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#554422"/>
      <stop offset="50%" stop-color="#886622"/>
      <stop offset="100%" stop-color="#332211"/>
    </linearGradient>
    <filter id="goldShine" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Plate with Subtle Radial Glow -->
  <rect width="256" height="192" fill="#0b0e14" rx="8"/>
  <circle cx="128" cy="92" r="85" fill="url(#bgGlow)"/>

  <!-- Gold Star Top Center -->
  <g filter="url(#goldShine)">
    <polygon points="128,20 133,34 148,35 137,45 141,59 128,50 115,59 119,45 108,35 123,34" fill="#ffe066"/>
  </g>

  <!-- Tactical Knife Graphic -->
  <g transform="translate(42, 42) scale(0.72)" filter="url(#goldShine)">
    <!-- Blade Body -->
    <path d="M 40,82 C 75,46 145,22 215,32 C 200,64 162,94 112,104 C 80,110 55,98 40,82 Z" fill="url(#goldBlade)" stroke="#ffe885" stroke-width="2"/>
    <!-- Curved Spine Highlight -->
    <path d="M 40,82 C 75,46 145,22 215,32" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
    <!-- Blade Blood Groove -->
    <path d="M 75,70 C 110,50 155,42 185,46" fill="none" stroke="#b37d00" stroke-width="2.5" opacity="0.7"/>
    <!-- Grip & Finger Ring -->
    <path d="M 40,82 L 15,116 C 10,132 25,142 40,136 L 66,116 L 55,96 Z" fill="url(#goldHandle)" stroke="#ffd700" stroke-width="1.5"/>
    <circle cx="30" cy="126" r="7.5" fill="#0b0e14" stroke="#ffd700" stroke-width="2"/>
  </g>

  <!-- Iconic Badge Text -->
  <g filter="url(#goldShine)">
    <text x="128" y="152" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="13" fill="#ffd700" text-anchor="middle" letter-spacing="2">★ SPECIAL RARE ★</text>
    <text x="128" y="170" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="10" fill="#ffc83b" text-anchor="middle" letter-spacing="1.5">ITEM</text>
  </g>
</svg>
